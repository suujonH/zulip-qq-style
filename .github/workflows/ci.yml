name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ZulipQQ.slnx
      - name: Build
        run: dotnet build ZulipQQ.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ZulipQQ.slnx -c Release --no-build

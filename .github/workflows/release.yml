name: Release

# 推送 v* tag 时编译并发布 zip 与自动更新清单；手动运行只生成构建产物，不创建 Release。
# 已安装的程序从 releases/latest/download/ZulipQQ-update.json 检查更新，所以只有正式版（tag 不含 -）会推送给用户。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $ver = '0.0.0-ci.${{ github.run_number }}'
          }
          "VERSION=$ver" >> $env:GITHUB_ENV
          "PKG=ZulipQQ-v$ver-win-x64" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --solution ZulipQQ.slnx -c Release

      - name: Publish
        run: |
          dotnet publish ZulipQQ/ZulipQQ.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -p:DebugType=none -o publish/ZulipQQ
          # DebugType=none 只影响本项目；SkiaSharp 等 NuGet 包自带的原生 pdb 仍会复制过来，这里一并删除
          Get-ChildItem publish/ZulipQQ -Filter *.pdb -File | ForEach-Object { Remove-Item -LiteralPath $_.FullName }

      - name: Publish updater
        run: |
          # 独立更新器（NativeAOT 单文件）；vcvars 可能找不到 vswhere，它用来定位链接器（同 tools/build-plugins.ps1）
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          if (Test-Path $installer) { $env:PATH = "$installer;$env:PATH" }
          dotnet publish ZulipQQ.Updater/ZulipQQ.Updater.csproj -c Release -r win-x64 -p:Version=$env:VERSION -p:DebugType=none -o publish/updater
          Copy-Item publish/updater/ZulipQQ.Updater.exe publish/ZulipQQ/

      - name: Build plugins
        run: |
          if (Test-Path tools/build-plugins.ps1) {
            ./tools/build-plugins.ps1 -OutDir publish/ZulipQQ/plugins
          } else {
            Write-Host 'tools/build-plugins.ps1 不存在，跳过插件编译'
          }

      # 生成文件清单、zip 和 ZulipQQ-update.json；版本号不合法或与程序不一致时失败
      - name: Pack
        run: ./tools/pack-release.ps1 -Version $env:VERSION -PublishDir publish/ZulipQQ -OutDir release-out

      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ghArgs = @('release', 'create', $tag, "release-out/$env:PKG.zip", 'release-out/ZulipQQ-update.json', '--title', $tag, '--generate-notes')
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          gh @ghArgs

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            release-out/${{ env.PKG }}.zip
            release-out/ZulipQQ-update.json

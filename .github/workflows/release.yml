name: Release

# 推送 v* tag 时编译并发布 zip；手动运行只生成构建产物，不创建 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $ver = '0.0.0-ci.${{ github.run_number }}'
          }
          "VERSION=$ver" >> $env:GITHUB_ENV
          "PKG=ZulipQQ-v$ver-win-x64" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --solution ZulipQQ.slnx -c Release

      - name: Publish
        run: |
          dotnet publish ZulipQQ/ZulipQQ.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -p:DebugType=none -o publish/ZulipQQ
          # DebugType=none 只影响本项目；SkiaSharp 等 NuGet 包自带的原生 pdb 仍会复制过来，这里一并删除
          Get-ChildItem publish/ZulipQQ -Filter *.pdb -File | ForEach-Object { Remove-Item -LiteralPath $_.FullName }

      - name: Build plugins
        run: |
          if (Test-Path tools/build-plugins.ps1) {
            ./tools/build-plugins.ps1 -OutDir publish/ZulipQQ/plugins
          } else {
            Write-Host 'tools/build-plugins.ps1 不存在，跳过插件编译'
          }

      - name: Zip
        run: Compress-Archive -Path publish/ZulipQQ/* -DestinationPath "$env:PKG.zip"

      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ghArgs = @('release', 'create', $tag, "$env:PKG.zip", '--title', $tag, '--generate-notes')
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          gh @ghArgs

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip

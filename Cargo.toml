[workspace]
resolver = "3"
members = ["crates/*", "app", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/suujonH/ZulipRust"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
zulip-core = { path = "crates/zulip-core" }
zulip-api = { path = "crates/zulip-api" }
zulip-store = { path = "crates/zulip-store" }
zulip-session = { path = "crates/zulip-session" }
zulip-update = { path = "crates/zulip-update" }
zulip-plugin-host = { path = "crates/zulip-plugin-host" }
zulip-plugin-sdk = { path = "crates/zulip-plugin-sdk" }
test-server = { path = "crates/test-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "multipart", "stream", "gzip"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
url = "2"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
ego-tree = "0.10"
regex = "1"
fancy-regex = "0.16"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libloading = "0.8"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
base64 = "0.22"
dirs = "6"
mime_guess = "2"
bytes = "1"
axum = { version = "0.8", features = ["multipart"] }
tempfile = "3"
log = "0.4"
dioxus = { version = "0.7", default-features = false, features = ["desktop", "macro", "html", "hooks", "signals", "launch"] }
rfd = "0.15"
arboard = "3"
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
